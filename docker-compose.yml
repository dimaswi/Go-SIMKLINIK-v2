version: '3.8'

services:
  # PostgreSQL Database
  ikami-database:
    image: postgres:15-alpine
    container_name: ikami-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ikami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ikami123}
      POSTGRES_DB: ${POSTGRES_DB:-ikami}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ikami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikami} -d ${POSTGRES_DB:-ikami}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikami-network

  # Backend API (Go)
  ikami-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikami-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_HOST: ikami-database
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-ikami}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ikami123}
      DATABASE_NAME: ${POSTGRES_DB:-ikami}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-Asia/Jakarta}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3001,http://119.28.111.184:3001,http://119.28.111.184,https://ikami.wismed.my.id,http://ikami.wismed.my.id}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      ikami-database:
        condition: service_healthy
    networks:
      ikami-network:
        aliases:
          - ikami-backend
          - simklinik-backend
    restart: unless-stopped
    volumes:
      - ikami_uploads:/root/uploads
      - ikami_backups:/root/backups

  # Frontend (React)
  ikami-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ikami-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - ikami-backend
    networks:
      ikami-network:
        aliases:
          - ikami-frontend
          - simklinik-frontend
    restart: unless-stopped

  # Cloudflare Tunnel (Opsional jika ingin menjalankan tunnel via Docker Compose)
  ikami-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ikami-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - ikami-frontend
    restart: unless-stopped
    networks:
      - ikami-network
    profiles:
      - tunnel

volumes:
  ikami_postgres_data:
  ikami_uploads:
  ikami_backups:

networks:
  ikami-network:
    driver: bridge
