version: '3.8'

services:
  # PostgreSQL Database
  simklinik-database:
    image: postgres:15-alpine
    container_name: simklinik-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simklinik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simklinik123}
      POSTGRES_DB: ${POSTGRES_DB:-simklinik}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - simklinik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simklinik} -d ${POSTGRES_DB:-simklinik}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simklinik-network

  # Backend API (Go)
  simklinik-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simklinik-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_HOST: simklinik-database
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-simklinik}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-simklinik123}
      DATABASE_NAME: ${POSTGRES_DB:-simklinik}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE:-Asia/Jakarta}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      simklinik-database:
        condition: service_healthy
    networks:
      - simklinik-network
    restart: unless-stopped
    volumes:
      - simklinik_uploads:/root/uploads
      - simklinik_backups:/root/backups

  # Frontend (React)
  simklinik-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simklinik-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - simklinik-backend
    networks:
      - simklinik-network
    restart: unless-stopped

volumes:
  simklinik_postgres_data:
  simklinik_uploads:
  simklinik_backups:

networks:
  simklinik-network:
    driver: bridge
