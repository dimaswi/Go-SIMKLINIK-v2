version: '3.8'

services:
  # PostgreSQL Database
  simklinik-database:
    image: postgres:15-alpine
    container_name: simklinik-database
    environment:
      POSTGRES_USER: simklinik
      POSTGRES_PASSWORD: simklinik123
      POSTGRES_DB: simklinik
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - simklinik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simklinik -d simklinik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simklinik-network

  # Backend API (Go)
  simklinik-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simklinik-backend
    environment:
      DATABASE_DSN: "host=simklinik-database user=simklinik password=simklinik123 dbname=simklinik port=5432 sslmode=disable"
      JWT_SECRET: "simklinik-secret-key-change-in-production"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      simklinik-database:
        condition: service_healthy
    networks:
      - simklinik-network
    restart: unless-stopped

  # Frontend (React)
  simklinik-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simklinik-frontend
    ports:
      - "3000:80"
    depends_on:
      - simklinik-backend
    networks:
      - simklinik-network
    restart: unless-stopped

volumes:
  simklinik_postgres_data:

networks:
  simklinik-network:
    driver: bridge
