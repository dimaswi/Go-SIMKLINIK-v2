version: '3.8'

services:
  # PostgreSQL Database (Dev)
  simklinik-database:
    image: postgres:15-alpine
    container_name: simklinik-database-dev
    environment:
      POSTGRES_USER: simklinik
      POSTGRES_PASSWORD: simklinik123
      POSTGRES_DB: simklinik
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - simklinik_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simklinik -d simklinik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simklinik-dev-network

volumes:
  simklinik_postgres_dev:

networks:
  simklinik-dev-network:
    driver: bridge
