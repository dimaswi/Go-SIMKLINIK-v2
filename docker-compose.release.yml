services:
  ikami-database:
    image: postgres:15-alpine
    container_name: ikami-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ikami_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ikami-network

  ikami-backend:
    image: ${BACKEND_IMAGE}
    container_name: ikami-backend
    environment:
      APP_ENV: production
      DATABASE_HOST: ikami-database
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE}
      DATABASE_TIMEZONE: ${DATABASE_TIMEZONE}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      BACKUP_STORAGE_PATH: /root/backups
      UPLOADS_PATH: /root/uploads
      BACKUP_DEFAULT_CRON: ${BACKUP_DEFAULT_CRON}
      BACKUP_DEFAULT_RETENTION_DAYS: ${BACKUP_DEFAULT_RETENTION_DAYS}
      BACKUP_DEFAULT_INCLUDE_UPLOADS: ${BACKUP_DEFAULT_INCLUDE_UPLOADS}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    depends_on:
      ikami-database:
        condition: service_healthy
    volumes:
      - ikami_uploads:/root/uploads
      - ikami_backups:/root/backups
    restart: unless-stopped
    networks:
      ikami-network:
        aliases:
          - ikami-backend
          - simklinik-backend

  ikami-frontend:
    image: ${FRONTEND_IMAGE}
    container_name: ikami-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - ikami-backend
    restart: unless-stopped
    networks:
      ikami-network:
        aliases:
          - ikami-frontend
          - simklinik-frontend

  ikami-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ikami-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - ikami-frontend
    restart: unless-stopped
    networks:
      - ikami-network
    profiles:
      - tunnel

volumes:
  ikami_postgres_data:
  ikami_uploads:
  ikami_backups:

networks:
  ikami-network:
    driver: bridge